[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "support-csat-doctor"
version = "1.0.0"
description = "Analyze a CSAT survey CSV export: averages, per-agent scores, and follow-up flags"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
support-csat-doctor = "support_csat_doctor:main_entry"

[tool.setuptools]
py-modules = ["support_csat_doctor"]
